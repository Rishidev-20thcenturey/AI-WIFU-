<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">AI-WIFU — expressive anime companion experience</title>
  <desc id="desc">Original cyberpunk interface illustration of an anime companion system, with a stylized holographic avatar pod, live voice waveform, camera vision, memory, music and character controls. This is a concept illustration, not a screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset=".48" stop-color="#0a1025"/>
      <stop offset="1" stop-color="#11091d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8bf5ff"/>
      <stop offset=".48" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff91d5"/>
      <stop offset=".53" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102840" stop-opacity=".94"/>
      <stop offset=".5" stop-color="#142039" stop-opacity=".72"/>
      <stop offset="1" stop-color="#19132e" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17243b" stop-opacity=".96"/>
      <stop offset="1" stop-color="#0b1223" stop-opacity=".98"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".22"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#d946ef" stop-opacity=".2"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8eb8ee" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="blur">
